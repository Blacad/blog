# Icarus 主题配置。日常修改个人信息、导航、侧栏与评论时编辑此文件。
version: 5.1.0
variant: default
toc: true

# 导航栏标志、浏览器图标和个人头像统一使用用户提供的照片。
logo: /img/Blacad.jpg
head:
  favicon: /img/Blacad.jpg
  manifest:
    name: Blacad's Blog
    short_name: Blacad
    start_url: /blog/
    theme_color: '#f3f4ee'
    background_color: '#f3f4ee'
    display: standalone
    icons:
      - src: /blog/img/Blacad.jpg
        sizes: 1080x1080
        type: image/jpeg
  open_graph:
    type: blog
    site_name: Blacad's Blog
    author: Blacad
  structured_data:
    author: Blacad
    publisher: Blacad's Blog
    publisher_logo: /blog/img/Blacad.jpg

navbar:
  menu:
    主页: /
    归档: /archives/
    分类: /categories/
    标签: /tags/
    关于: /about/
  links:
    GitHub:
      icon: fab fa-github
      url: https://github.com/Blacad

footer:
  copyright: © 2026 Blacad · 记录生活
  links:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    CC BY-NC 4.0:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by-nc/4.0/
    GitHub:
      icon: fab fa-github
      url: https://github.com/Blacad

article:
  highlight:
    theme: base16/atelier-forest-light
    clipboard: true
    fold: unfolded
  readtime: true
  update_time: auto
  licenses:
    Creative Commons:
      icon: fab fa-creative-commons
      url: https://creativecommons.org/
    Attribution:
      icon: fab fa-creative-commons-by
      url: https://creativecommons.org/licenses/by/4.0/
    Noncommercial:
      icon: fab fa-creative-commons-nc
      url: https://creativecommons.org/licenses/by-nc/4.0/

search:
  type: insight
  index_pages: true

comment:
  type: utterances
  repo: Blacad/blog
  issue_term: pathname
  label: blog-comments
  theme: github-light

# 左栏放个人信息与内容索引；右栏只放文章目录并保持悬挂。
sidebar:
  left:
    sticky: false
  right:
    sticky: true

widgets:
  - position: left
    type: profile
    author: Blacad
    # author_title: 在代码与文字之间，留下可复用的思考
    location: Hangzhou, China
    avatar: /img/Blacad.jpg
    avatar_rounded: true
    follow_link: https://github.com/Blacad
    social_links:
      GitHub:
        icon: fab fa-github
        url: https://github.com/Blacad
      Notebook:
        icon: fas fa-book
        url: https://blacad.github.io/notebook/
  - position: left
    type: recent_posts
  - position: left
    type: categories
  - position: left
    type: tags
    order_by: -length
    amount: 16
    show_count: true
  - position: right
    type: toc
    index: true
    collapsed: false
    depth: 3

plugins:
  animejs: true
  back_to_top: true
  busuanzi: false
  gallery: true
  katex: false
  mathjax: false
  outdated_browser: false
  # PJAX 不会同步 Icarus 的两栏/三栏 body 状态，也不会重放侧栏入场动画。
  pjax: false
  progressbar: true

providers:
  cdn: jsdelivr
  fontcdn: google
